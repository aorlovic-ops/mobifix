<!-- Unutar sekcije Podaci o uređaju -->
<h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-100 pb-1 pt-2">Podaci o uređaju</h3>

<div class="grid grid-cols-2 gap-3">
    <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Proizvođač (Brand)</label>
        <input type="text" name="brand" placeholder="npr. Apple" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
    </div>
    <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Model uređaja</label>
        <input type="text" name="model_uredjaja" placeholder="npr. iPhone 13" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
    </div>
</div>

<div class="grid grid-cols-2 gap-3 mt-3">
    <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">IMEI ili Serijski broj</label>
        <input type="text" name="imei_sn" placeholder="Opcionalno" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
    </div>
    <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">PIN / Šifra otključavanja</label>
        <input type="text" name="pin_uredjaja" placeholder="npr. 1234 ili Uzorak" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
    </div>
</div>
